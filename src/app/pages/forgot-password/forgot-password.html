<main class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <div class="auth-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M4 11.5L12 4l8 7.5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path d="M10 20v-5h4v5" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
        </svg>
      </div>

      @if (submitted()) {
        <h1>Revisa tu correo</h1>
        <p>Te enviamos un enlace para restablecer tu contraseña a {{ form.value.email }}</p>
      } @else {
        <h1>¿Olvidaste tu contraseña?</h1>
        <p>Ingresa tu correo y te enviaremos instrucciones para recuperarla</p>
      }
    </div>

    @if (!submitted()) {
      <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-field">
          <label for="email">Correo electrónico</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="ejemplo@correo.com"
            autocomplete="email"
          />
        </div>

        <button type="submit" class="submit-button">
          <span>Enviar instrucciones</span>
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M5 12h14M13 6l6 6-6 6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </form>
    }

    <div class="auth-card__footer">
      <a routerLink="/">← Volver a iniciar sesión</a>
    </div>
  </div>
</main>
