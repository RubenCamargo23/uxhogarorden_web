<main class="login-page">
  <div class="login-card">
    <div class="login-card__header">
      <div class="login-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M4 11.5L12 4l8 7.5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path d="M10 20v-5h4v5" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
        </svg>
        <span class="login-icon__badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M5 13l4 4L19 7"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </div>
      <h1>Iniciar sesión</h1>
      <p>Ingresa a tu cuenta para administrar tu hogar</p>
    </div>

    <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-field">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="ejemplo@correo.com"
          autocomplete="email"
        />
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>
        <div class="password-field">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.5 5.2A10.4 10.4 0 0 1 12 5c5 0 9 4 10 7-.4 1.1-1.1 2.3-2.1 3.4M6.6 6.6C4.5 8 3.1 10 2 12c1 3 5 7 10 7 1.3 0 2.6-.3 3.8-.8"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
              </svg>
            }
          </button>
        </div>
      </div>

      <div class="form-row">
        <label class="checkbox-field">
          <input type="checkbox" formControlName="rememberMe" />
          <span>Recordarme</span>
        </label>
        <a routerLink="/olvide-contrasena" class="forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="submit-button">
        <span>Ingresar</span>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M5 12h14M13 6l6 6-6 6"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </form>

    <div class="login-card__footer">
      <span>¿No tienes una cuenta?</span>
      <a routerLink="/crear-cuenta">Crear cuenta</a>
    </div>
  </div>
</main>
